# Aura — Linux system packages (deb + rpm) via nFPM.
# Built ONLY for releases (v* tags); see .github/workflows/desktop.yml.
# VERSION comes from the tag (v2.0.0 -> 2.0.0); nFPM expands env vars.
name: aura
arch: amd64
platform: linux
version: ${VERSION}
replaces:
  - lastwave
  - lastwave-desktop
conflicts:
  - lastwave
  - lastwave-desktop
section: sound
priority: optional
maintainer: Aura <https://github.com/aniketdubey1204-code/Aura-Desktop>
description: |-
  Aura — next-gen lossless music player: YouTube Music, lossless audio,
  word-synced lyrics, cross-device continuity and Last.fm scrobbling.
vendor: Aura
homepage: https://github.com/aniketdubey1204-code/Aura-Desktop
license: Proprietary — all rights reserved

contents:
  # Release bundle straight into /opt.
  - src: build/linux/x64/release/bundle
    dst: /opt/aura
    type: tree
  # CLI entry point.
  - src: /opt/aura/aura_desktop
    dst: /usr/bin/aura
    type: symlink
  # Desktop integration.
  - src: linux/packaging/aura.desktop
    dst: /usr/share/applications/aura.desktop
  - src: linux/packaging/aura.png
    dst: /usr/share/icons/hicolor/512x512/apps/aura.png

overrides:
  deb:
    depends:
      - libgtk-3-0
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1 | libappindicator3-1
      - libasound2
      - libmpv2
      - libkeybinder-3.0-0
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
      - libappindicator-gtk3
      - alsa-lib
      - mpv-libs
      - keybinder3
